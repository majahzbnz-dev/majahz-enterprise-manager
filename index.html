
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123c2c">
  <link rel="manifest" href="manifest.json">
  <title>MAJAHZ ENTERPRISE MANAGER</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f2;
      color: #18352a;
    }
    header {
      background: #123c2c;
      color: white;
      padding: 22px 16px;
    }
    header h2 { margin: 0 0 6px; }
    main { padding: 16px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .card {
      background: white;
      padding: 18px 12px;
      border-radius: 12px;
      box-shadow: 0 2px 7px #00000012;
    }
    .card p { margin: 0 0 10px; color: #60756a; }
    .card h3 { margin: 0; font-size: 20px; }
    .section {
      background: white;
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h2>MAJAHZ ENTERPRISE</h2>
    <p>Enterprise Manager Dashboard</p>
  </header>

  <main>
    <h3>Business Overview</h3>
    <div class="cards">
      <div class="card"><p>Total Money</p><h3>₦0.00</h3></div>
      <div class="card"><p>Products & Stock</p><h3>0</h3></div>
      <div class="card"><p>Total Sales</p><h3>₦0.00</h3></div>
      <div class="card"><p>Profit</p><h3>₦0.00</h3></div>
      <div class="card"><p>Expenses</p><h3>₦0.00</h3></div>
      <div class="card"><p>Outstanding</p><h3>₦0.00</h3></div>
    </div>

    
<div class="section">
  <h3>Products & Stock</h3>

  <form id="productForm">
    <label>Product Name</label>
    <input id="productName" type="text" placeholder="e.g. Ultima Feed" required>

    <label>Category</label>
    <select id="productCategory">
      <option value="Poultry Feed">Poultry Feed</option>
      <option value="Veterinary Medicine">Veterinary Medicine</option>
      <option value="Other">Other</option>
    </select>

    <label>Quantity</label>
    <input id="productQuantity" type="number" min="0" step="any" required>

    <label>Unit</label>
    <select id="productUnit">
      <option value="Bag">Bag</option>
      <option value="Mudu">Mudu</option>
      <option value="Bottle">Bottle</option>
      <option value="Carton">Carton</option>
      <option value="Piece">Piece</option>
    </select>
    
    <label>Mudu per Bag</label>
<input id="muduPerBag" type="number" min="1" value="21" required>
    
    <label>Cost Price (₦)</label>
    <input id="productCost" type="number" min="0" required>

    <label>Selling Price (₦)</label>
    <input id="productSelling" type="number" min="0" required>

    <button type="submit">Save Product</button>
  </form>

  <h3>Product List</h3>
  <div id="productList">No products added yet.</div>
</div>
<div class="section">
  <h3>Sales</h3>

  <form id="salesForm">
    <label>Select Product</label>
    <select id="saleProduct" required>
      <option value="">Choose product</option>
    </select>

    <label>Quantity (Mudu)</label>
    <input type="number" id="saleQuantityMudu" min="1" required>

    <label>Total Sale Amount (₦)</label>
    <input type="number" id="saleAmount" min="1" required>

    <button type="submit">Record Sale</button>
  </form>

  <h4>Sales History</h4>
  <div id="salesList"></div>
</div>
    
    <div class="section">
  <h3>Purchases</h3>

  <form id="purchaseForm">
    <label>Select Product</label>
    <select id="purchaseProduct" required>
      <option value="">Choose product</option>
    </select>

    <label>Quantity Purchased (Bags)</label>
    <input type="number" id="purchaseQuantity" min="0.01" step="any" required>

    <label>Total Purchase Cost (₦)</label>
    <input type="number" id="purchaseCost" min="1" required>

    <button type="submit">Record Purchase</button>
  </form>

  <h4>Purchase History</h4>
  <div id="purchaseList"></div>
</div>
    
 <script src="./database.js"></script>
<script src="./products.js"></script>
<script src="./sales.js"></script>
    
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>
</body>
</html>
