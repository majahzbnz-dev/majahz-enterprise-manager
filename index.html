

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123c2c">
  <title>MAJAHZ ENTERPRISE MANAGER</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f2;
      color: #17251d;
    }
    header {
      background: #123c2c;
      color: white;
      padding: 24px 18px;
    }
    header h2 { margin: 0 0 7px; }
    header p { margin: 0; color: #d2e6d8; }
    main { padding: 18px; }
    .section-title { margin: 10px 0 15px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .card {
      background: white;
      padding: 18px 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000c;
    }
    .card span { font-size: 24px; }
    .card h3 { font-size: 14px; margin: 12px 0 5px; }
    .card p { color: #758078; font-size: 12px; margin: 0; }
    footer {
      text-align: center;
      padding: 25px;
      color: #718076;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h2>MAJAHZ ENTERPRISE</h2>
    <p>Enterprise Manager Dashboard</p>
  </header>

  <main>
    <h3 class="section-title">Business Overview</h3>

    <div class="grid">
      <div class="card">
        <span>💰</span>
        <h3>Total Money</h3>
        <p>₦0.00</p>
      </div>
      <div class="card">
        <span>📦</span>
        <h3>Products & Stock</h3>
        <p>0 Products</p>
      </div>
      <div class="card">
        <span>🛒</span>
        <h3>Sales</h3>
        <p>₦0.00</p>
      </div>
      <div class="card">
        <span>📊</span>
        <h3>Profit</h3>
        <p>₦0.00</p>
      </div>
      <div class="card">
        <span>🧾</span>
        <h3>Expenses</h3>
        <p>₦0.00</p>
      </div>
      <div class="card">
        <span>📋</span>
        <h3>Outstanding</h3>
        <p>₦0.00</p>
      </div>
    </div>
  </main>

  <footer>
    MAJAHZ ENTERPRISE MANAGER<br>
    Developed for MAJAHZ
  </footer>
</body>
</html>
