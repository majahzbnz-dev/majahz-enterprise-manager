
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123c2c">
  <link rel="manifest" href="manifest.json">
  <title>MAJAHZ ENTERPRISE MANAGER</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f2;
      color: #18352a;
    }
    header {
      background: #123c2c;
      color: white;
      padding: 22px 16px;
    }
    header h2 { margin: 0 0 6px; }
    main { padding: 16px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .card {
      background: white;
      padding: 18px 12px;
      border-radius: 12px;
      box-shadow: 0 2px 7px #00000012;
    }
    .card p { margin: 0 0 10px; color: #60756a; }
    .card h3 { margin: 0; font-size: 20px; }
    .section {
      background: white;
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h2>MAJAHZ ENTERPRISE</h2>
    <p>Enterprise Manager Dashboard</p>
  </header>

  <main>
    <h3>Business Overview</h3>
    <div class="cards">
      <div class="card"><p>Total Money</p><h3>₦0.00</h3></div>
      <div class="card"><p>Products & Stock</p><h3>0</h3></div>
      <div class="card"><p>Total Sales</p><h3>₦0.00</h3></div>
      <div class="card"><p>Profit</p><h3>₦0.00</h3></div>
      <div class="card"><p>Expenses</p><h3>₦0.00</h3></div>
      <div class="card"><p>Outstanding</p><h3>₦0.00</h3></div>
    </div>

    <div class="section">
      <h3>Products & Stock</h3>
      <p>Manage your poultry feed and agrovet products.</p>
    </div>
  </main>

  <script src="./database.js"></script>
  <script src="./products.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>
</body>
</html>
